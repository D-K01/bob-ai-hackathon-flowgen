submission:
  title: "Flowgen AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
   Municipalities lose up to 30% of their treated drinking water due to undetected underground pipe bursts, 
   costing cities billions. Worse, localized water contamination—such as chemical runoff, heavy metals, or 
   bacterial growth—often goes unnoticed until citizens get sick. City operators lack a unified view to 
   cross-reference hydraulic pressure drops with chemical sensor spikes, resulting in slow and disorganized 
   containment responses.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
   FLOWGEN is an AI-powered water-network monitoring system that combines real-time sensor data, 
   machine-learning anomaly detection, contamination analysis, GIS-based risk mapping, and
   predictive maintenance. It continuously analyzes pressure, flow, and water-quality data 
   to detect hidden leaks or contamination, identify affected locations, predict downstream
   risk, and provide operators with clear alerts and recommended actions for faster response.


  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - ""                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - ""
    - ""
    - ""                               # optional 4th
    - ""                               # optional 5th

